spring.application.name=Vivso
spring.security.user.name=user
spring.security.user.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/vivso3?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
# Usa los nombres f\uFFFDsicos tal cual est\uFFFDn en las anotaciones @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Evita que Hibernate intente deducir nombres l\uFFFDgicos distintos
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.web=DEBUG

spring.servlet.multipart.max-file-size=5MB


spring.servlet.multipart.max-request-size=50MB
