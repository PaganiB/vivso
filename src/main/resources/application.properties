spring.application.name=Vivso
spring.security.user.name=user
spring.security.user.password=1234
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://localhost:3306/vivso3?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Usa los nombres físicos tal cual están en las anotaciones @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Evita que Hibernate intente deducir nombres lógicos distintos
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl